name: Firebase Rules Tests
run-name: "${{ github.event_name == 'pull_request' && format('Rules Tests for PR #{0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Rules Tests on {0}', github.ref_name) }}"

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Firestore/Storage Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install root tooling
        run: npm ci

      - name: Install rules test dependencies
        run: npm --prefix tests/rules ci

      - name: Run rules tests
        run: npx firebase emulators:exec --only firestore,storage --project demo-everything-passport 'npm --prefix tests/rules test'
