name: Build and Test
run-name: "${{ github.event_name == 'pull_request' && format('Build and Test for PR #{0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Build and Test on {0}', github.ref_name) }}"

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-and-test-mobile.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-and-test-mobile.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-mobile:
    name: Build and Test (Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    permissions:
      pull-requests: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Configure Firebase
        uses: ./.github/actions/configure-firebase
        with:
          service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project-id: ${{ secrets.FIREBASE_PROJECT_ID }}
          android-package-name: 'com.bsand49.everything_passport'
          ios-bundle-id: 'com.bsand49.everythingPassport'
          output-path: 'lib/firebase_options_dev.dart'
          working-directory: 'mobile'

      - name: Upload Firebase Configuration
        uses: actions/upload-artifact@v7
        with:
          name: firebase-config
          path: |
            mobile/lib/firebase_options_dev.dart
            mobile/android/app/google-services.json
            mobile/ios/Runner/GoogleService-Info.plist
          retention-days: 1

      - name: Generate mock files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: Report code coverage
        uses: ./.github/actions/report-coverage
        with:
          threshold: ${{ vars.MOBILE_COVERAGE_THRESHOLD || 90 }}

  smoke-test-mobile-android:
    name: Smoke Test (Android Emulator)
    needs: build-and-test-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Firebase Configuration
        uses: actions/download-artifact@v8
        with:
          name: firebase-config
          path: mobile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android SDK Components
        uses: actions/cache@v6 # Maintained v4 for path mapping stability
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-31/google_apis/x86_64/*
          key: avd-api-31-system-image-${{ runner.os }}-v1

      - name: Cache Gradle Build Outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/mobile/android/.gradle
            ${{ github.workspace }}/mobile/build
          key: gradle-outputs-${{ runner.os }}-${{ hashFiles('mobile/android/build.gradle*', 'mobile/android/app/build.gradle*', 'mobile/pubspec.yaml') }}
          restore-keys: |
            gradle-outputs-${{ runner.os }}-

      - name: Run Integration Tests (Smoke Test)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 pinned
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile
          script: flutter test --dart-define=SERVER_CLIENT_ID=${{ secrets.SERVER_CLIENT_ID }} integration_test/app_test.dart

  smoke-test-mobile-ios:
    name: Smoke Test (iOS Simulator)
    needs: build-and-test-mobile
    runs-on: macos-latest
    timeout-minutes: 45
    environment: dev

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 pinned
        with:
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Firebase Configuration
        uses: actions/download-artifact@v8
        with:
          name: firebase-config
          path: mobile

      - name: Configure Firebase iOS
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "No Firebase service account configured; using artifact config."
            exit 0
          fi
          dart pub global activate flutterfire_cli
          npm install -g firebase-tools@^15.37.0
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json" \
            flutterfire configure \
            --project=${{ secrets.FIREBASE_PROJECT_ID }} \
            --platforms=android,ios \
            --android-package-name=com.bsand49.everything_passport \
            --ios-bundle-id=com.bsand49.everythingPassport \
            --out=lib/firebase_options_dev.dart \
            --yes
          rm -f "$RUNNER_TEMP/service-account.json"

      - name: Select and boot iOS simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = [
              device
              for runtime_devices in data["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          if not candidates:
              sys.exit("No available iPhone simulators found")
          print(candidates[0]["udid"])
          ')
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Integration Tests (iOS Simulator)
        run: >-
          flutter test
          --dart-define=ENV=dev
          --dart-define=SERVER_CLIENT_ID=${{ secrets.SERVER_CLIENT_ID }}
          integration_test/app_test.dart
          -d ${{ steps.simulator.outputs.udid }}
